# mc-router: auto-discovers game pods and routes incoming connections to the
# right pod by hostname. Scales from zero because pods appear/disappear with games.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mc-router
  namespace: bedwars
  labels:
    app: mc-router
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mc-router
  template:
    metadata:
      labels:
        app: mc-router
    spec:
      serviceAccountName: mc-router
      containers:
        - name: mc-router
          image: itzg/mc-router:1.27.0
          args:
            - "--api-binding=:8080"
            - "--in-kube-cluster"
            - "--mapping=*.bedwars.local=velocity:25565"
          ports:
            - name: minecraft
              containerPort: 25565
            - name: api
              containerPort: 8080
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: mc-router
  namespace: bedwars
spec:
  type: LoadBalancer
  selector:
    app: mc-router
  ports:
    - name: minecraft
      port: 25565
      targetPort: 25565
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: mc-router
  namespace: bedwars
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: mc-router
  namespace: bedwars
rules:
  - apiGroups: [""]
    resources: ["pods", "services", "endpoints"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: mc-router
  namespace: bedwars
subjects:
  - kind: ServiceAccount
    name: mc-router
    namespace: bedwars
roleRef:
  kind: Role
  name: mc-router
  apiGroup: rbac.authorization.k8s.io