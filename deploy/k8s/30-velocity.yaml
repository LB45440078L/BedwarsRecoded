# Velocity: the persistent, single entry point. Players always connect here first;
# the proxy asks the controller where to send them.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: velocity
  namespace: bedwars
  labels:
    app: velocity
spec:
  replicas: 2
  selector:
    matchLabels:
      app: velocity
  template:
    metadata:
      labels:
        app: velocity
    spec:
      containers:
        - name: velocity
          image: bedwars-velocity:1.0.0
          # IfNotPresent so a locally built/loaded image (minikube, kind, a private
          # registry) is used as-is rather than pulled from a registry that does not
          # have it.
          imagePullPolicy: IfNotPresent
          env:
            - name: CONTROLLER_URL
              value: "http://bedwars-controller:8080"
            # TESTING ONLY: true flips the proxy to online-mode=false so clients that
            # never authenticated with Mojang can connect. See deploy/docker/
            # velocity-entrypoint.sh.
            - name: BEDWARS_OFFLINE_MODE
              value: "false"
            # Shared secret for the controller's mutating endpoints. optional=true: the
            # Secret is only created when a token is configured, and an absent one
            # leaves the variable unset, which every service reads as "no token".
            - name: BEDWARS_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: bedwars-controller-token
                  key: token
                  optional: true
            # Which registered server a player is placed on when they connect, and
            # where finished matches are sent back to. Must match the [servers] entry
            # and `try` in the proxy image's velocity.toml.
            - name: LOBBY_SERVER
              value: "lobby"
            # Game pods are ephemeral, so they are not in velocity.toml. The controller
            # names a pod by its id (which is its hostname), and the proxy dials
            # `<pod-id><POD_ADDRESS_SUFFIX>`. The GameServerSet's headless Service gives
            # every replica the DNS name <pod>.<gameserverset>.<namespace>.svc.cluster.local,
            # so this suffix is what makes an ephemeral pod addressable.
            - name: POD_ADDRESS_SUFFIX
              value: ".bedwars-solo.bedwars.svc.cluster.local"
          ports:
            - name: proxy
              containerPort: 25565
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "2"
              memory: "2Gi"
---
apiVersion: v1
kind: Service
metadata:
  name: velocity
  namespace: bedwars
spec:
  selector:
    app: velocity
  ports:
    - name: proxy
      port: 25565
      targetPort: 25565