# MySQL cluster for all player stats and persistence (constraint #4: no stats
# inside a pod). This is a minimal dev-grade StatefulSet; production should use a
# managed MySQL cluster or an operator (e.g. Vitess / MySQL Operator).
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mysql
  namespace: bedwars
spec:
  serviceName: mysql
  replicas: 1
  selector:
    matchLabels:
      app: mysql
  template:
    metadata:
      labels:
        app: mysql
    spec:
      containers:
        - name: mysql
          image: mysql:8.4
          env:
            - name: MYSQL_DATABASE
              value: bedwars
            - name: MYSQL_USER
              value: bedwars
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: bedwars-mysql
                  key: password
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: bedwars-mysql
                  key: root-password
          ports:
            - name: mysql
              containerPort: 3306
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "2"
              memory: "4Gi"
          volumeMounts:
            - name: data
              mountPath: /var/lib/mysql
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 10Gi
---
apiVersion: v1
kind: Service
metadata:
  name: mysql
  namespace: bedwars
spec:
  clusterIP: None
  selector:
    app: mysql
  ports:
    - port: 3306
      targetPort: 3306
---
apiVersion: v1
kind: Secret
metadata:
  name: bedwars-mysql
  namespace: bedwars
type: Opaque
stringData:
  password: "bedwars"
  root-password: "change-me"