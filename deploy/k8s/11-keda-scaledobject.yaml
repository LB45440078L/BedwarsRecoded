# KEDA autoscales the GameServerSet on queue depth. The controller exposes the
# depth as a Prometheus metric; KEDA reads it and adjusts replicas horizontally.
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: bedwars-solo
  namespace: bedwars
spec:
  scaleTargetRef:
    apiVersion: game.kruise.io/v1alpha1
    kind: GameServerSet
    name: bedwars-solo
  minReplicaCount: 0        # scale from zero
  maxReplicaCount: 50
  pollingInterval: 10
  cooldownPeriod: 120
  triggers:
    - type: prometheus
      metadata:
        serverAddress: http://prometheus.monitoring:9090
        metricName: bedwars_queue_depth
        # One pod per queued player, roughly; tune the divisor to your match size.
        query: sum(bedwars_queue_depth{group="solo"})
        threshold: "1"
---
# Karpenter provisions nodes when pod demand exceeds capacity. Its NodePool is
# cluster-scoped and usually owned by the platform team; this is an example.
apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: bedwars-games
spec:
  disruption:
    consolidationPolicy: WhenEmpty
    consolidateAfter: 30s
  template:
    spec:
      requirements:
        - key: kubernetes.io/arch
          operator: In
          values: ["amd64"]
        - key: karpenter.sh/capacity-type
          operator: In
          values: ["spot", "on-demand"]
      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: default
      expireAfter: 2h