# OpenKruise GameServerSet: pod lifecycle Ready -> Allocated -> Destroyed.
# Scaling starts at zero; KEDA (see 11-keda-scaledobject.yaml) and the controller
# drive replicas. Each replica is one ephemeral match pod.
apiVersion: game.kruise.io/v1alpha1
kind: GameServerSet
metadata:
  name: bedwars-solo
  namespace: bedwars
spec:
  replicas: 0
  serviceName: bedwars-solo
  gameServerTemplate:
    metadata:
      labels:
        app.kubernetes.io/name: gameserverset
    spec:
      containers:
        # Engine-agnostic name: the image runs whatever SERVER_ENGINE selected (Spigot
        # by default, Paper optionally), so nothing here should name the engine.
        - name: gameserver
          image: bedwars-spigot:1.0.0
          # IfNotPresent so a locally built/loaded image (minikube, kind, a private
          # registry) is used as-is; the OpenKruise default of Always would force a
          # pull from Docker Hub and fail for an image that only exists locally.
          imagePullPolicy: IfNotPresent
          ports:
            - name: minecraft
              containerPort: 25565
          env:
            - name: BEDWARS_ARENA_GROUP
              value: "solo"
            # Templates come from S3 in production; a baked template is used for dev.
            - name: BEDWARS_TEMPLATE_SOURCE
              value: "S3"
            - name: BEDWARS_CONTROLLER_URL
              value: "http://bedwars-controller:8080"
            # Shared secret for the controller's mutating endpoints. optional=true: the
            # Secret is only created when a token is configured, and an absent one
            # leaves the variable unset, which every service reads as "no token".
            - name: BEDWARS_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: bedwars-controller-token
                  key: token
                  optional: true
            - name: BEDWARS_TEMPLATE_S3_ENDPOINT
              valueFrom:
                configMapKeyRef:
                  name: bedwars-s3
                  key: endpoint
            - name: BEDWARS_TEMPLATE_S3_BUCKET
              valueFrom:
                configMapKeyRef:
                  name: bedwars-s3
                  key: bucket
            - name: BEDWARS_TEMPLATE_S3_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: bedwars-s3-credentials
                  key: access-key
            - name: BEDWARS_TEMPLATE_S3_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: bedwars-s3-credentials
                  key: secret-key
          resources:
            # Hard constraint #5: never run a pod without strict requests and limits.
            requests:
              cpu: "1"
              memory: "2Gi"
            limits:
              cpu: "2"
              memory: "4Gi"
          readinessProbe:
            tcpSocket:
              port: 25565
            initialDelaySeconds: 20
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: 25565
            initialDelaySeconds: 60
            periodSeconds: 15
            failureThreshold: 4
          lifecycle:
            preStop:
              exec:
                # Ask the plugin to start draining while the process is still alive.
                # It reports DRAINING to the controller and refuses new joins; the
                # match keeps running until the SIGTERM that follows this hook.
                command: ["/bin/sh", "-c", "sleep 5"]
      # The plugin reports DRAINING from its shutdown hook when SIGTERM arrives and then
      # exits; this grace period is what gives an in-flight match time to finish.
      terminationGracePeriodSeconds: 60