# Overrides for a local minikube verification of the persistent tier.
#   minikube image load bedwars-controller:1.0.0 bedwars-velocity:1.0.0
#   helm install bedwars deploy/helm/bedwars -n bedwars --create-namespace -f deploy/helm/values-minikube.yaml
image:
  tag: "1.0.0"
  # Images are loaded into the minikube node, not pulled from a registry.
  pullPolicy: Never

# Use the arena map baked into the image (deploy/templates/<name>) instead of S3:
# MinIO is disabled here, and a real map is what makes `/bw join` land in the arena.
# The entrypoint stages it as the pod's main world before Spigot starts.
arena:
  templateSource: LOCAL
  templateName: Glacier

controller:
  replicas: 1
velocity:
  replicas: 1
mcRouter:
  replicas: 1
  service:
    type: NodePort

mysql:
  storage: 1Gi
# MinIO is disabled here only because this sandbox cannot pull quay.io/minio/minio
# anonymously. The manifest (deploy/k8s/52-minio.yaml, minio.yaml template) is
# correct for clusters that can; or point s3.endpoint at an external store.
minio:
  enabled: false

# No Prometheus Operator / KEDA in a bare minikube; the GameServerSet CRD comes
# from OpenKruise (installed separately). Replicas stay 0 so no Spigot pod is
# created.
serviceMonitor:
  enabled: false
keda:
  enabled: false
gameServerSet:
  enabled: true
  replicas: 0
  # This node is only 4 GiB total, so the default 2/4Gi game-pod footprint
  # starves the API server. Use a small footprint that still boots Spigot.
  cpuRequest: 500m
  memoryRequest: 512Mi
  cpuLimit: "1"
  memoryLimit: 1536Mi
  # The 1.5 GiB limit is tight with a real arena loaded; keep the heap conservative so
  # metaspace, Netty buffers and the JVM itself still fit inside the limit.
  jvmOptions: "-XX:MaxRAMPercentage=55 -XX:+UseG1GC -XX:+ExitOnOutOfMemoryError"