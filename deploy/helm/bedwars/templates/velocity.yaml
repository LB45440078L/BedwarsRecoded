apiVersion: apps/v1
kind: Deployment
metadata:
  name: velocity
  labels:
    app: velocity
    {{- include "bedwars.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.velocity.replicas }}
  selector:
    matchLabels:
      app: velocity
  template:
    metadata:
      labels:
        app: velocity
    spec:
      containers:
        - name: velocity
          image: {{ include "bedwars.image" (dict "name" "bedwars-velocity" "root" .) }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: CONTROLLER_URL
              value: {{ include "bedwars.controllerUrl" . | quote }}
          ports:
            - name: proxy
              containerPort: 25565
          readinessProbe:
            tcpSocket:
              port: 25565
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "2"
              memory: "2Gi"
---
apiVersion: v1
kind: Service
metadata:
  name: velocity
  labels:
    app: velocity
    {{- include "bedwars.labels" . | nindent 4 }}
spec:
  selector:
    app: velocity
  ports:
    - name: proxy
      port: 25565
      targetPort: 25565
