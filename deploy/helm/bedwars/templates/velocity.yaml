apiVersion: apps/v1
kind: Deployment
metadata:
  name: velocity
  labels:
    app: velocity
    {{- include "bedwars.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.velocity.replicas }}
  selector:
    matchLabels:
      app: velocity
  template:
    metadata:
      labels:
        app: velocity
    spec:
      containers:
        - name: velocity
          image: {{ include "bedwars.image" (dict "name" "bedwars-velocity" "root" .) }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: CONTROLLER_URL
              value: {{ include "bedwars.controllerUrl" . | quote }}
            # TESTING ONLY: true flips the proxy to online-mode=false so clients that
            # never authenticated with Mojang can connect.
            - name: BEDWARS_OFFLINE_MODE
              value: {{ .Values.velocity.offlineMode | default false | quote }}
            # Shared secret for the controller's mutating endpoints. optional=true: the
            # Secret is only created when a token is configured, and an absent one
            # leaves the variable unset, which every service reads as "no token".
            - name: BEDWARS_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: bedwars-controller-token
                  key: token
                  optional: true
            # Players land in the lobby when they connect; finished matches return there.
            - name: LOBBY_SERVER
              value: {{ .Values.velocity.lobbyServer | quote }}
            # How an ephemeral game pod's name becomes a dialable address the proxy
            # can connect to (the GameServerSet's headless-Service DNS suffix).
            - name: POD_ADDRESS_SUFFIX
              value: {{ .Values.velocity.podAddressSuffix | quote }}
          ports:
            - name: proxy
              containerPort: 25565
          readinessProbe:
            tcpSocket:
              port: 25565
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "2"
              memory: "2Gi"
---
apiVersion: v1
kind: Service
metadata:
  name: velocity
  labels:
    app: velocity
    {{- include "bedwars.labels" . | nindent 4 }}
spec:
  selector:
    app: velocity
  ports:
    - name: proxy
      port: 25565
      targetPort: 25565
