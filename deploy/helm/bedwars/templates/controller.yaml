apiVersion: apps/v1
kind: Deployment
metadata:
  name: bedwars-controller
  labels:
    app: bedwars-controller
    {{- include "bedwars.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.controller.replicas }}
  selector:
    matchLabels:
      app: bedwars-controller
  template:
    metadata:
      labels:
        app: bedwars-controller
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: bedwars-controller
      containers:
        - name: controller
          image: {{ include "bedwars.image" (dict "name" "bedwars-controller" "root" .) }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: BEDWARS_NAMESPACE
              value: {{ .Release.Namespace | quote }}
            - name: BEDWARS_GAMESERVERSET
              value: {{ .Values.gameServerSet.name | quote }}
            - name: BEDWARS_HTTP_PORT
              value: "8080"
            - name: BEDWARS_MIN_REPLICAS
              value: {{ .Values.keda.minReplicas | quote }}
            - name: BEDWARS_MAX_REPLICAS
              value: {{ .Values.keda.maxReplicas | quote }}
            # Shared secret for the controller's mutating endpoints. optional=true: when
            # no token is configured the Secret does not exist and the variable stays
            # unset, which the controller reads as "run open".
            #  Must match the group the game pods register under (.Values.arena.group).
            #  A request that names no group resolves to this value on the controller; if
            #  the two disagree, no registered server can ever satisfy a queued player -
            #  the Docker path had precisely this bug, silently, for the same reason.
            - name: BEDWARS_ARENA_GROUP
              value: {{ .Values.arena.group | quote }}
            - name: BEDWARS_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: bedwars-controller-token
                  key: token
                  optional: true
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: "200m"
              memory: "256Mi"
            limits:
              cpu: "1"
              memory: "512Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: bedwars-controller
  labels:
    app: bedwars-controller
    {{- include "bedwars.labels" . | nindent 4 }}
spec:
  selector:
    app: bedwars-controller
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: bedwars-controller
  labels:
    {{- include "bedwars.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: bedwars-controller
  labels:
    {{- include "bedwars.labels" . | nindent 4 }}
rules:
  - apiGroups: ["game.kruise.io"]
    resources: ["gameserversets", "gameserversets/status"]
    verbs: ["get", "list", "watch", "update", "patch"]
  - apiGroups: [""]
    resources: ["pods", "services", "endpoints"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: bedwars-controller
  labels:
    {{- include "bedwars.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: bedwars-controller
roleRef:
  kind: Role
  name: bedwars-controller
  apiGroup: rbac.authorization.k8s.io
