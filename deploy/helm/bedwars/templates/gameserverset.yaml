{{- if .Values.gameServerSet.enabled }}
apiVersion: game.kruise.io/v1alpha1
kind: GameServerSet
metadata:
  name: {{ .Values.gameServerSet.name }}
  labels:
    app.kubernetes.io/name: gameserverset
    {{- include "bedwars.labels" . | nindent 4 }}
spec:
  {{- /*
    Replicas are owned by the CONTROLLER and KEDA, not by Helm: they scale this set up
    when players queue and back to zero when the last match ends. If the chart kept
    writing this field, every `helm upgrade` would fight the controller for ownership
    of it - and could reset replicas to 0 underneath a running match.

    So it is rendered only on the very first install (when the object does not exist).
    Afterwards the field is left exactly as the controller left it.
    (Under plain `helm template` there is no cluster to look up, so it is always
    rendered - which keeps `helm template`/kubeconform output reproducible.)
  */}}
  {{- if not (lookup "game.kruise.io/v1alpha1" "GameServerSet" .Release.Namespace .Values.gameServerSet.name) }}
  replicas: {{ .Values.gameServerSet.replicas }}
  {{- end }}
  serviceName: {{ .Values.gameServerSet.name }}
  gameServerTemplate:
    metadata:
      labels:
        app.kubernetes.io/name: gameserverset
    spec:
      terminationGracePeriodSeconds: {{ .Values.gameServerSet.terminationGracePeriodSeconds }}
      containers:
        - name: spigot
          image: {{ include "bedwars.image" (dict "name" "bedwars-spigot" "root" .) }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: minecraft
              containerPort: 25565
          env:
            - name: BEDWARS_SERVER_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: BEDWARS_ARENA_GROUP
              value: {{ .Values.arena.group | quote }}
            - name: BEDWARS_TEMPLATE_SOURCE
              value: {{ .Values.arena.templateSource | default "S3" | quote }}
            - name: BEDWARS_CONTROLLER_URL
              value: {{ include "bedwars.controllerUrl" . | quote }}
            - name: BEDWARS_TEMPLATE_NAME
              value: {{ .Values.arena.templateName | default "Glacier" | quote }}
            - name: BEDWARS_TEMPLATE_VERSION
              value: {{ .Values.arena.templateVersion | default "1.0.0" | quote }}
            # The container entrypoint stages the arena as the server's MAIN world
            # before Spigot starts, so the plugin must not also try to load a template.
            - name: BEDWARS_TEMPLATE_ENABLED
              value: {{ .Values.arena.templateEnabled | default false | quote }}
            # Tunable per deployment: the heap percentage is relative to the container's
            # memory limit, so it must be raised/lowered together with memoryLimit.
            - name: JAVA_TOOL_OPTIONS
              value: {{ .Values.gameServerSet.jvmOptions | quote }}
            - name: BEDWARS_TEMPLATE_S3_ENDPOINT
              valueFrom:
                configMapKeyRef:
                  name: bedwars-s3
                  key: endpoint
            - name: BEDWARS_TEMPLATE_S3_BUCKET
              valueFrom:
                configMapKeyRef:
                  name: bedwars-s3
                  key: bucket
            - name: BEDWARS_TEMPLATE_S3_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: bedwars-s3-credentials
                  key: access-key
            - name: BEDWARS_TEMPLATE_S3_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: bedwars-s3-credentials
                  key: secret-key
            - name: BEDWARS_DB_HOST
              value: "mysql"
            - name: BEDWARS_DB_NAME
              value: {{ .Values.mysql.database | quote }}
            - name: BEDWARS_DB_USER
              value: {{ .Values.mysql.username | quote }}
            - name: BEDWARS_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: bedwars-mysql
                  key: password
          resources:
            requests:
              cpu: {{ .Values.gameServerSet.cpuRequest | quote }}
              memory: {{ .Values.gameServerSet.memoryRequest | quote }}
            limits:
              cpu: {{ .Values.gameServerSet.cpuLimit | quote }}
              memory: {{ .Values.gameServerSet.memoryLimit | quote }}
          readinessProbe:
            tcpSocket:
              port: 25565
            initialDelaySeconds: 20
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: 25565
            initialDelaySeconds: 60
            periodSeconds: 15
            failureThreshold: 4
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "sleep 5"]
{{- end }}
