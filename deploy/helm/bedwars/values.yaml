# Default values for the bedwars chart. Override with -f / --set.

image:
  # Registry prefix, e.g. "ghcr.io/you". Empty = local images loaded into the cluster.
  registry: ""
  tag: "1.0.0"
  pullPolicy: IfNotPresent

# Arena group this release hosts.
arena:
  group: solo
  # Where the pod's arena world comes from: S3 (production) or LOCAL (baked into the
  # image, for dev/test). The container entrypoint stages it as the server's MAIN
  # world before Paper starts - Paper reads its world at startup, so a plugin cannot
  # do this. See deploy/docker/entrypoint.sh.
  templateSource: S3
  templateName: Glacier
  templateVersion: "1.0.0"
  # The plugin's own template loading is off by default because the entrypoint has
  # already staged the world. Turn it on only if you use the AdvancedSlimePaper path,
  # where the plugin loads a Slime template at runtime instead.
  templateEnabled: false
  teamCount: 2
  playersPerTeam: 2

# Ephemeral game pods.
gameServerSet:
  # Requires the OpenKruise GameServerSet CRD. Disable to install the persistent
  # tier (controller, proxies, MySQL, S3) on a cluster without OpenKruise.
  enabled: true
  name: bedwars-solo
  replicas: 0
  cpuRequest: "1"
  memoryRequest: "2Gi"
  cpuLimit: "2"
  memoryLimit: "4Gi"
  # JVM flags. Tune to the limit above: the heap percentage is of the container limit.
  # G1 is the safer default for containers; ZGC wants more native memory.
  jvmOptions: "-XX:MaxRAMPercentage=65 -XX:+UseG1GC -XX:+ExitOnOutOfMemoryError"
  terminationGracePeriodSeconds: 60

# Queue-driven autoscaling.
keda:
  enabled: true
  minReplicas: 0
  maxReplicas: 50
  pollingInterval: 10
  cooldownPeriod: 120
  prometheusAddress: "http://prometheus.monitoring:9090"

# Node autoscaling (cluster-scoped; usually owned by the platform team).
karpenter:
  enabled: false
  nodePool: bedwars-games

mcRouter:
  replicas: 1
  mapping: "*.bedwars.local=velocity:25565"
  service:
    type: LoadBalancer

velocity:
  replicas: 2

controller:
  replicas: 1

# Object storage for Slime templates.
s3:
  endpoint: "http://minio:9000"
  bucket: "bedwars-templates"
  region: "us-east-1"
  accessKey: "minioadmin"
  secretKey: "minioadmin"

# MySQL — dev-grade in-cluster. Set enabled=false to point at an external cluster.
mysql:
  enabled: true
  image: mysql:8.4
  database: bedwars
  username: bedwars
  password: bedwars
  rootPassword: rootpw
  storage: 10Gi

# Dev-only in-cluster S3. Set enabled=false for external object storage.
minio:
  enabled: true
  image: quay.io/minio/minio:latest
  storage: 5Gi

serviceMonitor:
  enabled: true

networkPolicy:
  enabled: true

pdb:
  enabled: true
