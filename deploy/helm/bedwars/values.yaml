# Default values for the bedwars chart. Override with -f / --set.

image:
  # Registry prefix, e.g. "ghcr.io/you". Empty = local images loaded into the cluster.
  registry: ""
  tag: "1.0.0"
  pullPolicy: IfNotPresent

# Arena group this release hosts.
arena:
  group: solo
  templateSource: S3
  teamCount: 2
  playersPerTeam: 2

# Ephemeral game pods.
gameServerSet:
  # Requires the OpenKruise GameServerSet CRD. Disable to install the persistent
  # tier (controller, proxies, MySQL, S3) on a cluster without OpenKruise.
  enabled: true
  name: bedwars-solo
  replicas: 0
  cpuRequest: "1"
  memoryRequest: "2Gi"
  cpuLimit: "2"
  memoryLimit: "4Gi"
  terminationGracePeriodSeconds: 60

# Queue-driven autoscaling.
keda:
  enabled: true
  minReplicas: 0
  maxReplicas: 50
  pollingInterval: 10
  cooldownPeriod: 120
  prometheusAddress: "http://prometheus.monitoring:9090"

# Node autoscaling (cluster-scoped; usually owned by the platform team).
karpenter:
  enabled: false
  nodePool: bedwars-games

mcRouter:
  replicas: 1
  mapping: "*.bedwars.local=velocity:25565"
  service:
    type: LoadBalancer

velocity:
  replicas: 2

controller:
  replicas: 1

# Object storage for Slime templates.
s3:
  endpoint: "http://minio:9000"
  bucket: "bedwars-templates"
  region: "us-east-1"
  accessKey: "minioadmin"
  secretKey: "minioadmin"

# MySQL — dev-grade in-cluster. Set enabled=false to point at an external cluster.
mysql:
  enabled: true
  image: mysql:8.4
  database: bedwars
  username: bedwars
  password: bedwars
  rootPassword: rootpw
  storage: 10Gi

# Dev-only in-cluster S3. Set enabled=false for external object storage.
minio:
  enabled: true
  image: quay.io/minio/minio:latest
  storage: 5Gi

serviceMonitor:
  enabled: true

networkPolicy:
  enabled: true

pdb:
  enabled: true
