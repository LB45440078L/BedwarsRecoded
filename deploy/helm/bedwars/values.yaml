# Default values for the bedwars chart. Override with -f / --set.

image:
  # Registry prefix, e.g. "ghcr.io/you". Empty = local images loaded into the cluster.
  registry: ""
  tag: "1.0.0"
  pullPolicy: IfNotPresent

# Arena group this release hosts.
arena:
  group: solo
  # Where the pod's arena world comes from: S3 (production) or LOCAL (baked into the
  # image, for dev/test). The container entrypoint stages it as the server's MAIN
  # world before Spigot starts - the server reads its world at startup, so a plugin
  # cannot do this. See deploy/docker/entrypoint.sh.
  templateSource: S3
  templateName: Glacier
  templateVersion: "1.0.0"
  # The plugin's own template loading is off by default because the entrypoint has
  # already staged the world. Turn it on to let the plugin's GameWorldService copy a
  # fresh world per match at runtime instead.
  templateEnabled: false
  teamCount: 2
  playersPerTeam: 2

# The network lobby: the hub every player lands on, and where matches return them.
# The same image as a game server, running in LOBBY role.
lobby:
  enabled: true
  replicas: 1
  # The world players wait in. Not baked into the image, so the server generates one
  # and logs that it did. Drop a hub map into deploy/templates/<name>/ to stage yours.
  world: lobby
  templateSource: LOCAL
  # flat = no terrain generation around the hub, and a predictable spawn.
  levelType: flat
  cpuRequest: "500m"
  memoryRequest: "1Gi"
  cpuLimit: "1"
  memoryLimit: "2Gi"

# Ephemeral game pods.
gameServerSet:
  # Requires the OpenKruise GameServerSet CRD. Disable to install the persistent
  # tier (controller, proxies, MySQL, S3) on a cluster without OpenKruise.
  enabled: true
  name: bedwars-solo
  replicas: 0
  cpuRequest: "1"
  memoryRequest: "2Gi"
  cpuLimit: "2"
  memoryLimit: "4Gi"
  # JVM flags. Tune to the limit above: the heap percentage is of the container limit.
  # G1 is the safer default for containers; ZGC wants more native memory.
  jvmOptions: "-XX:MaxRAMPercentage=65 -XX:+UseG1GC -XX:+ExitOnOutOfMemoryError"
  terminationGracePeriodSeconds: 60

# Queue-driven autoscaling.
keda:
  enabled: true
  minReplicas: 0
  maxReplicas: 50
  pollingInterval: 10
  cooldownPeriod: 120
  prometheusAddress: "http://prometheus.monitoring:9090"

# Node autoscaling (cluster-scoped; usually owned by the platform team).
karpenter:
  enabled: false
  nodePool: bedwars-games

mcRouter:
  replicas: 1
  mapping: "*.bedwars.local=velocity:25565"
  service:
    type: LoadBalancer

velocity:
  replicas: 2
  # TESTING ONLY. true runs the proxy in offline mode (online-mode=false): clients
  # are not verified with Mojang and any name may be used. Never for a public server.
  # The installer exposes this as a question; the default is the safe one.
  offlineMode: false
  # The registered server a player is placed on when they connect, and where finished
  # matches are sent back to. Must match the [servers] entry and `try` in the proxy
  # image's velocity.toml.
  lobbyServer: lobby
  # Game pods are ephemeral, so they are not in velocity.toml. The proxy dials
  # <pod-id><podAddressSuffix>: the GameServerSet's headless Service gives each replica
  # the name <pod>.<gameserverset>.<namespace>.svc.cluster.local.
  podAddressSuffix: ".bedwars-solo.bedwars.svc.cluster.local"

controller:
  replicas: 1
  # Shared secret for the controller's mutating endpoints (/pods/*, /lobby/queue).
  # Leave empty and the controller runs OPEN, which is only safe because it is
  # ClusterIP-only (see the manual). Set it and the chart creates the Secret, hands it
  # to the controller, and passes it to the proxy and to every game pod: the secret is
  # what lets a pod register at all. The installer generates one for you.
  apiToken: ""

# Object storage for world templates.
s3:
  endpoint: "http://minio:9000"
  bucket: "bedwars-templates"
  region: "us-east-1"
  accessKey: "minioadmin"
  secretKey: "minioadmin"

# MySQL — dev-grade in-cluster. Set enabled=false to point at an external cluster.
mysql:
  enabled: true
  image: mysql:8.4
  database: bedwars
  username: bedwars
  password: bedwars
  rootPassword: rootpw
  storage: 10Gi

# Dev-only in-cluster S3. Set enabled=false for external object storage.
minio:
  enabled: true
  image: quay.io/minio/minio:latest
  storage: 5Gi

serviceMonitor:
  enabled: true

networkPolicy:
  enabled: true

pdb:
  enabled: true
