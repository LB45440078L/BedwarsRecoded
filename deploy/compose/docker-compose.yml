# BedwarsRecoded local integration stack.
#
# Brings up the non-Kubernetes equivalent of the production platform so the
# controller, MySQL and S3 can be exercised end-to-end without a cluster:
#
#   docker compose -f deploy/compose/docker-compose.yml up --build
#   ./deploy/verify.sh                      # structure + unit tests
#
# The optional `game` profile adds one real Spigot game pod (heavy: the image
# builds Spigot from source with BuildTools, which takes several minutes). The default stack (infra + controller) is
# the part meant to run anywhere.
name: bedwars

x-controller-env: &controller-env
  BEDWARS_NAMESPACE: "local"
  BEDWARS_GAMESERVERSET: "bedwars-solo"
  BEDWARS_HTTP_PORT: "8080"
  BEDWARS_MIN_REPLICAS: "0"
  BEDWARS_MAX_REPLICAS: "10"
  BEDWARS_PREWARM_THRESHOLD: "2"
  # This stack has no cluster, so the controller must provision with Docker. Left
  # unset it would default to KUBERNETES and report "no capacity" forever.
  BEDWARS_PROVISIONER: "DOCKER"
  BEDWARS_DOCKER_IMAGE: "bedwars-spigot:1.0.0"
  BEDWARS_ARENA_GROUP: "solo"
  # Game containers join this network so they can resolve the controller by name; and
  # the URL they are handed must use that name rather than the host's loopback.
  BEDWARS_DOCKER_NETWORK: "bedwars_bedwars"
  BEDWARS_CONTROLLER_ADVERTISE_URL: "http://controller:8080"
  # Shared secret for the controller's mutating endpoints. Blank = open controller.
  # When set, the controller also hands it to every game container it provisions, and
  # the proxy presents it on /lobby/queue. Set it in the same .env for all services.
  BEDWARS_API_TOKEN: "${BEDWARS_API_TOKEN:-}"

services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${BEDWARS_DB_NAME:-bedwars}
      MYSQL_USER: ${BEDWARS_DB_USER:-bedwars}
      MYSQL_PASSWORD: ${BEDWARS_DB_PASSWORD:-bedwars}
      MYSQL_ROOT_PASSWORD: ${BEDWARS_DB_ROOT_PASSWORD:-rootpw}
    ports:
      - "${BEDWARS_DB_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-p${BEDWARS_DB_ROOT_PASSWORD:-rootpw}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [bedwars]

  minio:
    image: ${BEDWARS_MINIO_IMAGE:-quay.io/minio/minio:latest}
    # Dev stack: run as root so a freshly-created (root-owned) named volume is
    # writable regardless of which MinIO image is used.
    user: "0:0"
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${BEDWARS_S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${BEDWARS_S3_SECRET_KEY:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    networks: [bedwars]

  # Creates the template bucket and makes it readable for the dev-only anonymous
  # template GET. Retries until MinIO is reachable (no fragile healthcheck).
  minio-init:
    image: ${BEDWARS_MC_IMAGE:-quay.io/minio/mc:latest}
    depends_on:
      minio:
        condition: service_started
    entrypoint: ["/bin/sh", "-c"]
    environment:
      S3_USER: ${BEDWARS_S3_ACCESS_KEY:-minioadmin}
      S3_PASS: ${BEDWARS_S3_SECRET_KEY:-minioadmin}
      S3_BUCKET: ${BEDWARS_S3_BUCKET:-bedwars-templates}
    command:
      - |
        until mc alias set local http://minio:9000 "$$S3_USER" "$$S3_PASS"; do
          echo 'waiting for minio...'; sleep 2;
        done
        mc mb --ignore-existing "local/$$S3_BUCKET"
        mc anonymous set download "local/$$S3_BUCKET"
        echo 'minio bucket ready'
    networks: [bedwars]

  controller:
    build:
      context: ../..
      dockerfile: deploy/docker/controller.Dockerfile
      args:
        # The controller provisions game containers through this Docker socket, so
        # the image needs the docker CLI. Dev-only convenience.
        WITH_DOCKER_CLI: "true"
    environment:
      <<: *controller-env
    ports:
      - "8080:8080"
    volumes:
      # Lets the controller start/reclaim game containers on the host daemon.
      # Mounting the socket gives the container root-equivalent power: local dev only.
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [bedwars]

  # Optional: one real client-facing proxy. Enable with `--profile network`.
  # Players connect here (port 25565); the proxy puts them in the lobby and then
  # moves them into a match. Without it there is no way to place a player anywhere.
  velocity:
    profiles: [network]
    image: bedwars-velocity:1.0.0
    build:
      context: ../..
      dockerfile: deploy/docker/velocity.Dockerfile
    environment:
      CONTROLLER_URL: "http://controller:8080"
      # Must match the controller's BEDWARS_API_TOKEN or every queue request is refused.
      BEDWARS_API_TOKEN: "${BEDWARS_API_TOKEN:-}"
      # TESTING ONLY. true flips the proxy to online-mode=false so clients that never
      # authenticated with Mojang can connect. Anyone can then join as any name:
      # never leave it on for a public server.
      BEDWARS_OFFLINE_MODE: "${BEDWARS_OFFLINE_MODE:-false}"
      # Must match the [servers] entry and `try` in deploy/docker/velocity.toml.
      LOBBY_SERVER: "lobby"
      # Empty in Docker: a container name resolves on the shared network by itself.
      # Kubernetes sets this to the GameServerSet's headless-Service suffix.
      POD_ADDRESS_SUFFIX: ""
    ports:
      - "25565:25565"
    depends_on:
      controller:
        condition: service_started
      lobby:
        condition: service_started
    networks: [bedwars]

  # Optional: the network lobby, the hub every player lands on. Enable with
  # `--profile network`. The SAME image as a game server, in LOBBY role: it hosts no
  # matches and never registers with the controller as a match host.
  lobby:
    profiles: [network]
    image: bedwars-spigot:1.0.0
    build:
      context: ../..
      dockerfile: deploy/docker/gameserver.Dockerfile
      args:
        SERVER_ENGINE: ${SERVER_ENGINE:-spigot}
        SPIGOT_REV: ${SPIGOT_REV:-26.3}
        PAPER_VERSION: ${PAPER_VERSION:-}
    environment:
      BEDWARS_ROLE: "LOBBY"
      BEDWARS_SERVER_ID: "lobby"
      # The world players wait in is staged from the image like an arena. No template
      # named 'lobby' is baked in, so the server generates a flat one and logs it.
      BEDWARS_TEMPLATE_NAME: "lobby"
      BEDWARS_TEMPLATE_SOURCE: "LOCAL"
      BEDWARS_LEVEL_TYPE: "flat"
      BEDWARS_RETURN_TO_LOBBY: "false"
    ports:
      # Debug-only direct access. Players normally arrive through the proxy.
      - "25566:25565"
    networks: [bedwars]

  # Optional: one real game server. Enable with `--profile game`.
  #
  # It builds with the Spigot engine unless you say otherwise. Drop a jar in
  # server-jars/ first to skip the Spigot compile; set SERVER_ENGINE=paper to run
  # Paper instead (never compiled). See server-jars/README.md.
  game-pod:
    profiles: [game]
    image: bedwars-spigot:1.0.0
    build:
      context: ../..
      dockerfile: deploy/docker/gameserver.Dockerfile
      args:
        SERVER_ENGINE: ${SERVER_ENGINE:-spigot}
        SPIGOT_REV: ${SPIGOT_REV:-26.3}
        PAPER_VERSION: ${PAPER_VERSION:-}
    environment:
      # Must be a name the proxy can resolve: the controller hands this to Velocity as
      # the address to send a player to. The compose service name resolves on the
      # shared network.
      BEDWARS_SERVER_ID: "game-pod"
      BEDWARS_ARENA_GROUP: "solo"
      BEDWARS_CONTROLLER_URL: "http://controller:8080"
      BEDWARS_API_TOKEN: "${BEDWARS_API_TOKEN:-}"
      BEDWARS_TEMPLATE_NAME: "Glacier"
      BEDWARS_TEMPLATE_VERSION: "1.0.0"
      BEDWARS_TEMPLATE_SOURCE: "LOCAL"
      BEDWARS_TEMPLATE_S3_ENDPOINT: "http://minio:9000"
      BEDWARS_TEMPLATE_S3_BUCKET: ${BEDWARS_S3_BUCKET:-bedwars-templates}
      BEDWARS_DB_HOST: "mysql"
      BEDWARS_DB_PORT: "3306"
      BEDWARS_DB_NAME: ${BEDWARS_DB_NAME:-bedwars}
      BEDWARS_DB_USER: ${BEDWARS_DB_USER:-bedwars}
      BEDWARS_DB_PASSWORD: ${BEDWARS_DB_PASSWORD:-bedwars}
    ports:
      # Debug-only direct access; the proxy publishes 25565 and is the real entry point.
      - "25567:25565"
    depends_on:
      mysql:
        condition: service_healthy
      controller:
        condition: service_started
    networks: [bedwars]

volumes:
  mysql-data:
  minio-data:

networks:
  bedwars:
    driver: bridge
    # Fixed name so BEDWARS_DOCKER_NETWORK is predictable: compose would otherwise
    # prefix it with the project name, and containers started by the controller with
    # `docker run --network` would join a network that does not exist.
    name: bedwars_bedwars