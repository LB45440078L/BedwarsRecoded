name: CI

on:
  push:
    branches: [ master, main ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Build and test
        run: mvn -B -ntp verify

      - name: Verify plugin JAR is under 4 MB
        run: |
          JAR=$(ls BedwarsRecoded-Spigot/target/BedwarsRecoded-Spigot-*.jar | head -1)
          SIZE=$(stat -c%s "$JAR")
          echo "Plugin JAR: $JAR ($SIZE bytes)"
          if [ "$SIZE" -gt 4194304 ]; then
            echo "::error::Plugin JAR exceeds the 4 MB budget ($SIZE bytes)"
            exit 1
          fi

      - name: Upload plugin artifact
        uses: actions/upload-artifact@v4
        with:
          name: BedwarsRecoded-Spigot
          path: BedwarsRecoded-Spigot/target/BedwarsRecoded-Spigot-*.jar

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: '**/target/surefire-reports/*.txt'