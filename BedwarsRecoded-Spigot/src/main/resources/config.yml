# =============================================================================
#  BedwarsRecoded - plugin configuration
# =============================================================================
#  This plugin runs ONLY as a managed game server: a container started by the
#  controller (Docker or Kubernetes). It pulls its world from the template store,
#  reports its capacity and lifecycle to the controller, and writes stats to the
#  shared database. There is no unmanaged mode - deploy it with
#  deploy/compose/docker-compose.yml or deploy/k8s/.
# =============================================================================

# Identity of this server in every controller report. ${VAR} placeholders are
# expanded from the environment (falling back to the local hostname for HOSTNAME /
# COMPUTERNAME); in Kubernetes the Downward API sets HOSTNAME to the pod name.
#
# This id MUST be a name the proxy can resolve, because the controller hands it to
# Velocity as the address of the server to send a player to. In Kubernetes the pod
# name resolves as <pod>.<gameserverset>.<namespace>.svc.cluster.local, so the id is
# the bare pod name and POD_ADDRESS_SUFFIX supplies the rest. The Docker provisioner
# overrides this with the container name, which resolves on the shared network.
server-id: "${HOSTNAME}"

# -----------------------------------------------------------------------------
# The match this server hosts (exactly one match, one arena group, per pod).
# -----------------------------------------------------------------------------
arena:
  group: "solo"
  # How many concurrent BedWars matches this server may host. 1 (the default) means the
  # server runs a single match on its existing world. Values above 1 give each match its
  # own world, copied from the template below (or, in K8s, its own Slime world), and the
  # server reports the resulting free match slots to the controller.
  games-per-server: 1
  team-count: 2
  players-per-team: 2
  countdown-seconds: 15
  sudden-death-after-seconds: 300
  # Y below which a falling player is counted as a void kill.
  void-y-threshold: 0.0
  # Approximate island radius used for protection/void checks.
  island-radius: 30.0
  # Radius around a team's bed that is protected from enemies.
  bed-protection-radius: 3.0

# -----------------------------------------------------------------------------
# Sudden-death dragons. A team that bought "Dragon Buff" brings one dragon per
# level at sudden death; these settings control the neutral dragons and behaviour.
# -----------------------------------------------------------------------------
dragon:
  enabled: true
  # Neutral dragons that spawn at sudden death and attack every team.
  base-per-match: 1
  # Dragon health, so it survives long enough to matter.
  health: 300.0
  # How far above the island/centre a dragon spawns.
  spawn-height: 25.0
  # How hard a dragon knocks nearby players away (velocity magnitude).
  knockback: 3.0
  knockback-radius: 10.0
  knockback-interval-ticks: 10
  # How much of the map the dragon tears up as it flies: a radius around it, and how
  # far below it the damage reaches down to the surface.
  destroy-radius: 3
  destroy-depth: 40
  destroy-interval-ticks: 20
  # Optional heart damage per knockback pulse (0 = knockback only).
  damage: 0.0

# -----------------------------------------------------------------------------
# Server-level guarantees the plugin applies at boot.
# -----------------------------------------------------------------------------
server:
  # What this process is. One image serves both roles:
  #   GAME  (default) a dedicated match host. It reports free match slots to the
  #         controller so players can be routed to it, and it hosts BedWars matches.
  #   LOBBY the persistent hub every player lands on after connecting to the proxy.
  #         It hosts no matches and never reports capacity, so the controller can never
  #         hand it players as if it were a game server. Signs and NPCs in the lobby
  #         ask the proxy to send a player into a match.
  # Overridable with BEDWARS_ROLE (the container sets it per deployment).
  role: "GAME"

  # A Minecraft server can have its whitelist switched on by its own default, and an
  # EMPTY whitelist then rejects everyone with "You are not whitelisted on this
  # server!" - fatal for a game server, whose job is to accept the players the
  # controller routes to it. The queue is the access control, not the whitelist.
  #
  # OFF   (default) switch the whitelist off at boot.
  # LEAVE never touch it - the plugin leaves your whitelist exactly as you set it.
  #
  # Overridable with BEDWARS_WHITELIST.
  force-whitelist-off: "OFF"

lobby:
  # Off by default because most servers are game pods. Set server.role: "LOBBY" (or
  # BEDWARS_ROLE=LOBBY) to make this process the hub. See docs/MANUAL.md chapter 9.
  #
  # The world players wait in. The container's entrypoint stages it as the server's main
  # world before the JVM starts (BEDWARS_TEMPLATE_NAME), exactly like an arena.
  world: "lobby"
  # When a match ends, ask the proxy to move its players back here. This is what makes
  # the loop a loop: lobby -> match -> lobby, and not "match, then stranded on a pod
  # that is about to be deleted". Needs the network proxy; a standalone server simply
  # drops the request.
  return-to-lobby: true

# -----------------------------------------------------------------------------
# World template. Production reads a Slime world from S3-compatible storage and
# loads it with AdvancedSlimePaper; LOCAL copies a plain world directory and is a
# documented, NON-PRODUCTION fallback.
# -----------------------------------------------------------------------------
template:
  # false = do not touch the world at all: the server keeps whatever world it has
  # and the plugin just runs the game logic. It removes template loading from the
  # logs entirely, which is handy when a server is started with a pre-baked world.
  enabled: true
  name: "Glacier"
  version: "1.0.0"
  source: "LOCAL"          # S3 (production) | LOCAL (dev only)
  # Directory CONTAINING templates: one sub-directory per template name.
  local-path: "templates"
  s3:
    endpoint: "http://minio:9000"
    bucket: "bedwars-templates"
    region: "us-east-1"
    # Leave blank for a public bucket. When set, requests are signed with
    # AWS Signature Version 4 (works with AWS S3, MinIO, Ceph).
    access-key: ""
    secret-key: ""

# -----------------------------------------------------------------------------
# Persistence. Stats, leaderboards and quick-buy layouts all live outside the pod,
# in a shared MySQL, so that a pod can be destroyed at any time.
# -----------------------------------------------------------------------------
persistence:
  # false = run entirely without a database. The plugin never opens a JDBC
  # connection and simply has no stats.
  enabled: true

database:
  host: "mysql"            # in Kubernetes this is the Service name
  port: 3306
  name: "bedwars"
  username: "bedwars"
  password: "bedwars"
  pool-size: 4
  # ELO a brand-new player starts at.
  baseline-elo: 1000

# -----------------------------------------------------------------------------
# Controller. Every game server reports its capacity and lifecycle here, and this is
# also where it learns what to do next.
# -----------------------------------------------------------------------------
controller:
  # Overridable with BEDWARS_CONTROLLER_URL. In a container this must be the
  # controller's name on the shared network (its Kubernetes Service / compose alias).
  base-url: "http://bedwars-controller:8080"
  heartbeat-seconds: 15
  # Reporting safety net. The FIRST failure to reach the controller is always logged
  # with its reason; further failures are logged at most once every
  # `failure-log-interval-seconds`; after `disable-reporting-after-failures` in a row,
  # reporting stops for the session. This is what keeps a down or missing controller
  # from filling the console with connection errors on every heartbeat.
  disable-reporting-after-failures: 5
  failure-log-interval-seconds: 300

# -----------------------------------------------------------------------------
# Ranking.
# -----------------------------------------------------------------------------
ranking:
  k-factor: 32
  leaderboard-refresh-seconds: 60
  leaderboard-page-size: 100

# -----------------------------------------------------------------------------
# Logging.
# -----------------------------------------------------------------------------
logging:
  # true  = one JSON object per gameplay event, carrying game_id / pod_id /
  #         player_uuid, ready for Loki or ELK. false = plain text lines.
  json: true
