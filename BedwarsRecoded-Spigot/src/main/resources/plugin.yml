name: "BedwarsRecoded"
version: ${project.version}
main: dev.bedwars.spigot.BedwarsRecodedPlugin
# Loads on every Spigot 26.x server: api-version is the lowest supported (26.1) while
# the plugin is compiled against the 26.3 Spigot API. No Paper-only surface is used.
api-version: '26.1'
authors: [ "BedwarsRecoded" ]
description: "Spigot Bedwars game server. One match per pod; pod destruction is the reset."
website: ${project.url}
# Loaded at startup when the server supports plugin libraries (Spigot 26.x / Paper), so
# the plugin jar stays tiny (constraint: JAR < 4 MB). The plugin degrades gracefully
# (persistence disabled, no crash) if the server cannot provide them.
libraries:
  - "com.zaxxer:HikariCP:6.3.0"
  - "com.mysql:mysql-connector-j:9.3.0"
commands:
  bedwars:
    description: "Bedwars game-pod administration."
    aliases: [ bw ]
    # NOTE: no command-level permission. In a game pod every player must be able to
    # run `/bw join`, `/bw shop`, `/bw lang`, ... A blanket permission here blocked
    # all gameplay commands for regular players. Admin subcommands (start/stop/reload)
    # are gated individually in BedwarsCommand.
#
# Permission nodes MUST be declared here. Bukkit evaluates a node that no plugin declares
# as `PermissionDefault.FALSE`, which is false even for an operator — so a permission
# checked in code but missing from this file silently denies everyone, server owner
# included.
permissions:
  bedwars.admin:
    description: "Administrative subcommands (start, stop, create, upgrades, reload)."
    default: op
  bedwars.lobby.build:
    description: "Build in the network lobby: place the matchmaking signs and NPCs. The hub
      otherwise refuses block place/break for everyone, so hedged staff need this to set it up."
    default: op